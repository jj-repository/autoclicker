name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-linux.txt -r requirements-dev.txt pyinstaller==6.13.0

    - name: Run tests
      run: python -m pytest test_autoclicker.py -v

    - name: Build Linux executable
      run: |
        pyinstaller --onefile --name Autoclicker-Linux --hidden-import autoclicker_core --add-data "icon.png:." --add-data "takodachi.png:." autoclicker_evdev.py

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: linux-executables
        path: |
          dist/Autoclicker-Linux

  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt pyinstaller==6.13.0

    - name: Run tests
      run: python -m pytest test_autoclicker.py -v

    - name: Build Windows executable
      run: |
        pyinstaller --onefile --windowed --name Autoclicker --hidden-import autoclicker_core --icon=icon.ico --add-data "icon.ico;." --add-data "icon.png;." --add-data "takodachi.png;." autoclicker.py

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: windows-executables
        path: |
          dist/Autoclicker.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: Download Linux artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: linux-executables
        path: dist/linux

    - name: Download Windows artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: windows-executables
        path: dist/windows

    - name: Attest build provenance
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v2
      with:
        subject-path: |
          dist/linux/Autoclicker-Linux
          dist/windows/Autoclicker.exe

    - name: Generate SHA256SUMS
      run: |
        (cd dist/linux && sha256sum Autoclicker-Linux) > SHA256SUMS
        (cd dist/windows && sha256sum Autoclicker.exe) >> SHA256SUMS
        sha256sum autoclicker.py >> SHA256SUMS

    - name: Create Release
      run: |
        gh release create "${{ github.ref_name }}" \
          dist/linux/Autoclicker-Linux \
          dist/windows/Autoclicker.exe \
          SHA256SUMS \
          --title "${{ github.ref_name }}" \
          --notes "$(cat <<'NOTES'
        ## Installation

        ### Windows
        1. Download `Autoclicker.exe`
        2. Run it (may need Administrator privileges)

        ### Linux
        1. Download `Autoclicker-Linux`
        2. Make it executable: `chmod +x Autoclicker-Linux`
        3. Run with sudo: `sudo ./Autoclicker-Linux`
        NOTES
        )"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepend download disclaimer to release notes
      run: |
        TAG="${{ github.ref_name }}"
        DISCLAIMER=$'## 📥 Downloads\n\n**Just grab one file:**\n- **Windows** → `Autoclicker.exe`\n- **Linux** → `Autoclicker-Linux` (requires sudo)\n\nThe `SHA256SUMS` file is an optional checksum for verifying the download — you don\'t need it to use the app.\n\n---\n\n'
        BODY=$(gh release view "$TAG" --json body -q .body)
        printf '%s%s' "$DISCLAIMER" "$BODY" > /tmp/release_notes.md
        gh release edit "$TAG" --notes-file /tmp/release_notes.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
